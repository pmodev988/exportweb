spring.application.name=exportweb
server.address=127.0.0.1
server.port=${EXPORTWEB_PORT:8098}
server.forward-headers-strategy=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${EXPORTWEB_DATABASE_URL}
spring.datasource.username=${EXPORTWEB_DATABASE_USER}
spring.datasource.password=${EXPORTWEB_DATABASE_PASSWORD}
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
spring.servlet.multipart.max-file-size=${EXPORTWEB_MEDIA_MAX:20MB}
spring.servlet.multipart.max-request-size=${EXPORTWEB_MEDIA_MAX:20MB}
spring.security.oauth2.client.registration.exportweb.provider=identity
spring.security.oauth2.client.registration.exportweb.client-id=exportweb-web
spring.security.oauth2.client.registration.exportweb.client-secret=${EXPORTWEB_OIDC_SECRET}
spring.security.oauth2.client.registration.exportweb.scope=openid,profile,email
spring.security.oauth2.client.registration.exportweb.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.exportweb.redirect-uri=https://{baseHost}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.identity.issuer-uri=${EXPORTWEB_IDENTITY_ISSUER}
exportweb.identity.url=${EXPORTWEB_IDENTITY_INTERNAL_URL}
exportweb.identity.key-file=${EXPORTWEB_IDENTITY_KEY_FILE}
exportweb.air.url=${EXPORTWEB_AIR_URL:}
exportweb.air.credentials-directory=${EXPORTWEB_AIR_CREDENTIALS_DIRECTORY:}
exportweb.import.max-pages=${EXPORTWEB_IMPORT_MAX_PAGES:60}
exportweb.import.max-bytes=${EXPORTWEB_IMPORT_MAX_BYTES:2097152}
exportweb.export.max-asset-bytes=${EXPORTWEB_EXPORT_MAX_ASSET_BYTES:20971520}
exportweb.export.max-total-bytes=${EXPORTWEB_EXPORT_MAX_TOTAL_BYTES:104857600}
exportweb.export.max-seconds=${EXPORTWEB_EXPORT_MAX_SECONDS:90}
exportweb.media.bucket=${EXPORTWEB_MEDIA_BUCKET:}
exportweb.media.endpoint=${EXPORTWEB_MEDIA_ENDPOINT:}
exportweb.media.region=${EXPORTWEB_MEDIA_REGION:us-east-1}
exportweb.media.credentials-file=${EXPORTWEB_MEDIA_CREDENTIALS_FILE:}
spring.rabbitmq.addresses=${EXPORTWEB_QUEUE_ADDRESS:amqp://localhost:5672}
spring.rabbitmq.username=${EXPORTWEB_QUEUE_USER:guest}
spring.rabbitmq.password=${EXPORTWEB_QUEUE_PASSWORD:guest}
spring.rabbitmq.virtual-host=${EXPORTWEB_QUEUE_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1
exportweb.jobs.queue=${EXPORTWEB_QUEUE_NAME:exportweb.business}

exportweb.inquiry.max-per-hour=${EXPORTWEB_INQUIRY_MAX_PER_HOUR:10}
